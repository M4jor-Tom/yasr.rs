[package]
name = "yasr"
version = "0.1.0"
edition = "2021"

[dependencies]
xcap = "0.4"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
ctrlc = "3"
ratatui = "0.29"
crossterm = "0.28"

[lib]
name = "yasr"
path = "src/lib.rs"

[[bin]]
name = "yasr-cli"
path = "src/bin/yasr-cli.rs"

[[bin]]
name = "yasr-tui"
path = "src/bin/yasr-tui.rs"
